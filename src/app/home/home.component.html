<section>
    @if(organization){
        <h1>{{ organization.name }}</h1>
    }
    @else{
        <form [formGroup]="createOrgForm" (submit)="createOrganization()">
            <label for="name">Name</label>
            <input id="name" type="text" formControlName="name" />

            <button type="submit">Create Org</button>
        </form>
    }
</section>
