<section>
    @for(org of organizations; track org.id) {
        <h2>{{ org.name }}</h2>
    }
    <form [formGroup]="createOrgForm" (submit)="createOrganization()">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" />

        <button type="submit">Create Org</button>
    </form>
</section>
